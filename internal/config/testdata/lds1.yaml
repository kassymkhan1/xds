- name: listener_0
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8080
  filter_chains:
    - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            codec_type: AUTO
            stat_prefix: ingress_http
            route_config:
              name: listener_0
              virtual_hosts:
                - name: upstream
                  domains: ["*"]
                  routes:
                    - match:
                        prefix: "/dedicated"
                      route:
                        cluster: dedicated

                    - match:
                        prefix: "/"
                      route:
                        cluster: echo

                    
            http_filters:
              - name: envoy.filters.http.router
