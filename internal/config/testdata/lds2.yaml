- name: listener_0
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 80
  filter_chains:
    - filters:
        - name: envoy.filters.network.connection_limit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.connection_limit.v3.ConnectionLimit
            stat_prefix: ingress_ws_to_ws
            max_connections: 2048
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_ws_to_ws
            upgrade_configs:
              - upgrade_type: websocket
            route_config:
              virtual_hosts:
                - name: main
                  cors:
                    allow_origin_string_match:
                      - safe_regex:
                          google_re2: {}
                          regex: \*
                    allow_methods: GET, PUT, DELETE, POST, OPTIONS
                    allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,x-api-key
                  domains:
                    - "*"
                  routes:
                    - match:
                        prefix: "/test/"
                        headers:
                          - name: connection
                            exact_match: Upgrade
                      route:
                        prefix_rewrite: "/"
                        cluster: shared_envoy
                    - match:
                        prefix: "/"
                        headers:
                          - name: connection
                            exact_match: Upgrade
                      route:
                        cluster: shared_envoy
                    - match:
                        prefix: "/"
                      redirect:
                        https_redirect: true
            http_filters:
              - name: envoy.filters.http.cors
              - name: envoy.router
