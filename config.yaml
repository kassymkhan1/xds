# Service inventory served to Envoy via xDS. Each entry becomes one
# listener + route + EDS cluster + endpoint set. Edit and save this file
# while xds-server is running - it's polled and hot-reloaded automatically.

services:
  - name: backend_cluster
    listener_port: 10000
    endpoints:
      - host: 127.0.0.1
        port: 8080

