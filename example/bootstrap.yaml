# Example Envoy bootstrap that fetches its entire configuration (CDS, EDS,
# LDS, RDS) from the xds-server control plane in this repo via ADS.
#
# Run the control plane:
#   go run ./cmd/xds-server -port 18000 -node-id test-id
#
# Then run Envoy against this bootstrap:
#   envoy -c example/bootstrap.yaml
#
# Envoy's admin interface will be on :9901, and the dynamically configured
# listener from resources.go will come up on :10000.

node:
  id: test-id
  cluster: example-cluster

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    grpc_services:
      - envoy_grpc:
          cluster_name: xds_cluster
  cds_config:
    ads: {}
    resource_api_version: V3
  lds_config:
    ads: {}
    resource_api_version: V3

static_resources:
  clusters:
    - name: xds_cluster
      connect_timeout: 1s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: xds_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 18000 }
